# DataLens AI — Production Nginx Configuration
# Usage: docker-compose -f docker-compose.prod.yaml up nginx
# or with the "full" profile for all services.

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    server backend:8000;
}

server {
    listen 80 default_server;
    server_name _;

    # Redirect to HTTPS (enable when TLS certificates are set up)
    # return 301 https://$host$request_uri;

    # Frontend static assets
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Backend API
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running analyses
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # WebSocket for agent streaming
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Extended timeout for long-running agent conversations
        proxy_read_timeout 3600s;
    }

    # Backend health check
    location /health {
        proxy_pass http://backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Upload endpoint (large payloads)
    location /upload {
        proxy_pass http://backend_upstream/upload;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        client_max_body_size 100M;
        proxy_read_timeout 120s;
    }

    # Document root for health endpoint
    location = /api/health {
        proxy_pass http://frontend_upstream/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

